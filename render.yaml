services:
  # ─────────────────────────────────────────────────────────────────
  # Django Backend (Web Service)
  # ─────────────────────────────────────────────────────────────────
  - type: web
    name: cms-backend
    runtime: python
    rootDir: backend_django
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn course_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: coursemanagementsystem-ihix.onrender.com,.onrender.com,localhost
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: https://course-management-system-xi-ten.vercel.app,http://localhost:5173,http://localhost:3000
      - key: DATABASE_URL
        fromDatabase:
          name: cms-db
          property: connectionString
      - key: DB_SSL
        value: True

  # ─────────────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────────────────────────
databases:
  - name: cms-db
    databaseName: course_management_db
    user: cms_user
    plan: free
