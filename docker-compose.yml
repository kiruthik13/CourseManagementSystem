version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cms-postgres
    environment:
      - POSTGRES_DB=course_management_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d course_management_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend_django
    container_name: cms-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=course_management_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DEBUG=True
      - SECRET_KEY=django-insecure-course-management-system-key-2026
    volumes:
      - ./backend_django:/app
    command: python manage.py runserver 0.0.0.0:8000
    restart: always

  frontend:
    image: node:20-alpine
    container_name: cms-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host"
    restart: always

volumes:
  postgres_data:

